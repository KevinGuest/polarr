<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent !important;
        overflow: hidden;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        color: #fafafa;
        user-select: none;
        -webkit-user-select: none;
        outline: none;
        border: 0;
      }
      #root {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        padding: 14px;
        background: transparent;
        outline: none;
        border: 0;
      }
      .menu {
        box-sizing: border-box;
        width: 100%;
        min-width: 0;
        overflow: hidden;
        border-radius: 0.5rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: #09090b;
        padding: 0.25rem;
        /* Soft depth only — no OS window shadow (that draws the rectangular frame). */
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
        outline: none;
      }
      .menu:focus {
        outline: none;
      }
      .label {
        padding: 0.375rem 0.625rem;
        font-size: 0.75rem;
        font-weight: 500;
        color: #a1a1aa;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sep {
        height: 1px;
        margin: 0.25rem 0.25rem;
        background: rgba(255, 255, 255, 0.1);
      }
      .item {
        display: flex;
        width: 100%;
        appearance: none;
        border: 0;
        background: transparent;
        color: #fafafa;
        cursor: pointer;
        align-items: center;
        border-radius: 0.375rem;
        padding: 0.5rem 0.625rem;
        font: inherit;
        font-size: 0.875rem;
        text-align: left;
        outline: none;
      }
      .item:hover,
      .item:focus-visible {
        background: rgba(255, 255, 255, 0.08);
      }
      .item.danger {
        color: #f87171;
      }
      .item.danger:hover,
      .item.danger:focus-visible {
        background: rgba(248, 113, 113, 0.12);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/chrome-menu.ts"></script>
  </body>
</html>
