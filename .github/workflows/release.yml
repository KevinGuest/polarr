name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

env:
  # Incremental artifacts bloat GHA cache; rust-cache restores a full release target instead.
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            bundles: app,dmg
            artifact_glob: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            artifact_name: macos-universal
          - platform: windows-latest
            target: ""
            bundles: nsis
            artifact_glob: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            artifact_name: windows-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Apple targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: ${{ matrix.artifact_name }}
          cache-on-failure: true

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      # Empty APPLE_* env vars make the bundler try (and fail) to import a blank cert.
      # Strip whitespace so wrapped/pasted secrets still decode.
      - name: Configure environment
        if: runner.os == 'macOS'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT" ]; then
            echo "Signing material is not set; shipping an unsigned macOS build."
            exit 0
          fi
          CERT_B64=$(printf '%s' "$CERT" | tr -d '[:space:]')
          if ! printf '%s' "$CERT_B64" | base64 -d >/dev/null 2>&1; then
            echo "::error::APPLE_CERTIFICATE is not valid base64. Re-copy with: openssl base64 -A -in cert.p12 | pbcopy"
            exit 1
          fi
          {
            echo "APPLE_CERTIFICATE<<CERT_EOF"
            printf '%s\n' "$CERT_B64"
            echo "CERT_EOF"
            echo "APPLE_CERTIFICATE_PASSWORD<<PW_EOF"
            printf '%s\n' "$CERT_PASSWORD"
            echo "PW_EOF"
            echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
          if [ -z "$NOTARY_APPLE_ID" ] || [ -z "$NOTARY_PASSWORD" ] || [ -z "$NOTARY_TEAM_ID" ]; then
            echo "::warning::Certificate present but notarization secrets are incomplete. Gatekeeper will still block downloads."
            exit 0
          fi
          {
            echo "APPLE_ID=$NOTARY_APPLE_ID"
            echo "APPLE_PASSWORD=$NOTARY_PASSWORD"
            echo "APPLE_TEAM_ID=$NOTARY_TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: desktop-v__VERSION__
          releaseName: Polarr Desktop v__VERSION__
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseBody: |
            - **Music settings** — Playlists and Playback now live together under Music
            - **Equalizer** — turn it on or off, adjust six bands, or choose a sound preset
            - **Playback options** — Crossfade, Gapless, volume levels, and Mono Audio
            - **Audio output** — choose a connected speaker or headphones in the desktop app
            - **Account menu** — the Windows avatar now opens the shared profile drawer
            - **Desktop header** — removes the extra Polarr logo and keeps Home beside search

            ## Downloads

            - **macOS (Apple Silicon + Intel):** `Polarr_*_universal.dmg`
            - **Windows:** `Polarr_*_x64-setup.exe`

            Installed apps check this release for auto-updates via `latest.json`.

            Connect on first launch with your self-hosted Polarr server URL.

            ### macOS: “Apple could not verify Polarr”

            Unsigned builds are quarantined by Gatekeeper. After copying **Polarr.app** to Applications:

            1. **System Settings → Privacy & Security**
            2. Scroll to **Polarr was blocked** → **Open Anyway**
            3. Confirm **Open**

            Or in Terminal:

            `xattr -cr /Applications/Polarr.app && open /Applications/Polarr.app`

            Right-click → Open is unreliable on macOS Sequoia and later.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target && format('--target {0} --bundles {1}', matrix.target, matrix.bundles) || format('--bundles {0}', matrix.bundles) }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: warn
