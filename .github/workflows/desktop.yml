name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            artifact_glob: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            artifact_name: polarr-desktop-macos-universal.dmg
          - platform: windows-latest
            target: ""
            artifact_glob: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            artifact_name: polarr-desktop-windows-x64-setup.exe

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      # Empty APPLE_* env vars make Tauri try (and fail) to import a blank cert.
      # Only export them when a real Developer ID .p12 is present.
      - name: Enable Apple signing and notarization
        if: runner.os == 'macOS'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT" ]; then
            echo "APPLE_CERTIFICATE is not set; shipping an unsigned macOS build."
            echo "Gatekeeper will block downloaded copies until a Developer ID cert + notarization secrets are added."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE<<CERT_EOF"
            printf '%s\n' "$CERT"
            echo "CERT_EOF"
            echo "APPLE_CERTIFICATE_PASSWORD<<PW_EOF"
            printf '%s\n' "$CERT_PASSWORD"
            echo "PW_EOF"
            echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
          if [ -z "$NOTARY_APPLE_ID" ] || [ -z "$NOTARY_PASSWORD" ] || [ -z "$NOTARY_TEAM_ID" ]; then
            echo "::warning::Certificate present but APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID are incomplete. App will be signed but not notarized, so Gatekeeper will still block downloads."
            exit 0
          fi
          {
            echo "APPLE_ID=$NOTARY_APPLE_ID"
            echo "APPLE_PASSWORD=$NOTARY_PASSWORD"
            echo "APPLE_TEAM_ID=$NOTARY_TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "Apple Developer ID signing + notarization enabled."

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: desktop-v__VERSION__
          releaseName: Polarr Desktop v__VERSION__
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseBody: |
            ## Downloads

            - **macOS (Apple Silicon + Intel):** `Polarr_*_universal.dmg`
            - **Windows:** `Polarr_*_x64-setup.exe`

            Installed apps check this release for auto-updates via `latest.json`.

            Connect on first launch with your self-hosted Polarr server URL.

            ### macOS: “Apple could not verify Polarr”

            Unsigned builds are quarantined by Gatekeeper. After copying **Polarr.app** to Applications:

            1. **System Settings → Privacy & Security**
            2. Scroll to **Polarr was blocked** → **Open Anyway**
            3. Confirm **Open**

            Or in Terminal:

            `xattr -cr /Applications/Polarr.app && open /Applications/Polarr.app`

            Right-click → Open is unreliable on macOS Sequoia and later.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Upload workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: warn
