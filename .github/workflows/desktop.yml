name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            artifact_glob: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            artifact_name: polarr-desktop-macos-universal.dmg
          - platform: windows-latest
            target: ""
            artifact_glob: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            artifact_name: polarr-desktop-windows-x64-setup.exe

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: desktop-v__VERSION__
          releaseName: Polarr Desktop v__VERSION__
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseBody: |
            ## Downloads

            - **macOS (Apple Silicon + Intel):** `Polarr_*_universal.dmg`
            - **Windows:** `Polarr_*_x64-setup.exe`

            Installed apps check this release for auto-updates via `latest.json`.

            Connect on first launch with your self-hosted Polarr server URL.

            ### macOS unsigned builds

            If Gatekeeper blocks the app, right-click **Polarr.app** → **Open**, or run:

            `xattr -cr /Applications/Polarr.app`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Upload workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: warn
