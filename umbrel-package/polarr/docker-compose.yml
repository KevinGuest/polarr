version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: polarr_web_1
      APP_PORT: 3000
      PROXY_AUTH_WHITELIST: "/api/*"
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/kevinguest/polarr-app:0.6.0@sha256:3ea8355ee5af057e28a78b0480f00b2d977e3693d04c0438d5767382b688552a
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      - POLARR_DATA_DIR=/data
      - POLARR_MUSIC_DIR=/music
      # Lidarr downloads to /downloads/music — {Artist}/file, no extra nest
      - POLARR_DOWNLOADS_DIR=/music
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - POLARR_APP_VERSION=0.6.2
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${UMBREL_ROOT}/data/storage/downloads/music:/music
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/v1/status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
