version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: polarr_web_1
      APP_PORT: 3000
      PROXY_AUTH_WHITELIST: "/api/*"
      PROXY_AUTH_ADD: "false"

  web:
    # Digest pinned after GHCR publish — bump both on release.
    image: ghcr.io/kevinguest/polarr-app:0.6.15@sha256:777b6ede916a2d029e026d37f460c7fa0c62779a0444cd39f28496841b1d1fef
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      - POLARR_DATA_DIR=/data
      # Default scan root — override in Admin → Sources after Browse
      - POLARR_MUSIC_DIR=/music
      # Fallback downloads nest under the chosen music root when possible
      - POLARR_DOWNLOADS_DIR=/music/downloads
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - POLARR_APP_VERSION=0.6.15
    volumes:
      - ${APP_DATA_DIR}/data:/data
      # Full Umbrel downloads tree so File Browser can open real Lidarr/SABnzbd
      # paths (e.g. /downloads/media/music, /downloads/complete/music).
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
      # Back-compat mount (older setups / shortcuts still use /music).
      - ${UMBREL_ROOT}/data/storage/downloads/music:/music
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/v1/status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
