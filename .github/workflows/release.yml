name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

env:
  # Incremental artifacts bloat GHA cache; rust-cache restores a full release target instead.
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            bundles: app,dmg
            artifact_glob: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            artifact_name: macos-universal
          - platform: windows-latest
            target: ""
            bundles: nsis
            artifact_glob: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            artifact_name: windows-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Apple targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: ${{ matrix.artifact_name }}
          cache-on-failure: true

      # Shared UI source lives at /src, so its imports resolve through the root
      # node_modules. Local machines already have that tree; clean runners do not.
      - name: Install shared UI dependencies
        run: npm ci --ignore-scripts

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      # Empty APPLE_* env vars make the bundler try (and fail) to import a blank cert.
      # Strip whitespace so wrapped/pasted secrets still decode.
      - name: Configure environment
        if: runner.os == 'macOS'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT" ]; then
            echo "Signing material is not set; shipping an unsigned macOS build."
            exit 0
          fi
          CERT_B64=$(printf '%s' "$CERT" | tr -d '[:space:]')
          if ! printf '%s' "$CERT_B64" | base64 -d >/dev/null 2>&1; then
            echo "::error::APPLE_CERTIFICATE is not valid base64. Re-copy with: openssl base64 -A -in cert.p12 | pbcopy"
            exit 1
          fi
          {
            echo "APPLE_CERTIFICATE<<CERT_EOF"
            printf '%s\n' "$CERT_B64"
            echo "CERT_EOF"
            echo "APPLE_CERTIFICATE_PASSWORD<<PW_EOF"
            printf '%s\n' "$CERT_PASSWORD"
            echo "PW_EOF"
            echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
          if [ -z "$NOTARY_APPLE_ID" ] || [ -z "$NOTARY_PASSWORD" ] || [ -z "$NOTARY_TEAM_ID" ]; then
            echo "::warning::Certificate present but notarization secrets are incomplete. Gatekeeper will still block downloads."
            exit 0
          fi
          {
            echo "APPLE_ID=$NOTARY_APPLE_ID"
            echo "APPLE_PASSWORD=$NOTARY_PASSWORD"
            echo "APPLE_TEAM_ID=$NOTARY_TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: desktop-v__VERSION__
          releaseName: Polarr Desktop v__VERSION__
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseBody: |
            - **Faster YouTube playback** — one-shot resolve cuts cold-start stream lag
            - **Smarter library matching** — filename downloads get real titles; collabs play from disk
            - **Taste autoplay** — queues prefer artists you actually listen to
            - **Player covers** — expanded player, Lock Screen, and Dynamic Island art fixed on iOS
            - **Security harden** — API auth gates, playlist SSRF allowlist, stream path containment

            ## Downloads

            - **macOS (Apple Silicon + Intel):** `Polarr_*_universal.dmg`
            - **Windows:** `Polarr_*_x64-setup.exe`

            Installed apps check this release for auto-updates via `latest.json`.

            Connect on first launch with your self-hosted Polarr server URL.

            ### macOS: “Apple could not verify Polarr”

            Unsigned builds are quarantined by Gatekeeper. After copying **Polarr.app** to Applications:

            1. **System Settings → Privacy & Security**
            2. Scroll to **Polarr was blocked** → **Open Anyway**
            3. Confirm **Open**

            Or in Terminal:

            `xattr -cr /Applications/Polarr.app && open /Applications/Polarr.app`

            Right-click → Open is unreliable on macOS Sequoia and later.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.target && format('--target {0} --bundles {1}', matrix.target, matrix.bundles) || format('--bundles {0}', matrix.bundles) }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: warn

  # GitHub's /releases/latest/download/<name> can stick on an older release that
  # still has the same asset name. Keep latest.json only on the newest desktop
  # release so the Tauri updater endpoint stays correct.
  finalize-updater:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Drop latest.json from prior desktop releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(
            gh api "repos/${{ github.repository }}/releases" --paginate \
              --jq '.[] | select(.draft == false and (.tag_name | startswith("desktop-v"))) | .tag_name'
          )
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "No published desktop releases"
            exit 0
          fi
          latest="${tags[0]}"
          echo "Keeping latest.json on ${latest}"
          for tag in "${tags[@]:1}"; do
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx 'latest.json'; then
              echo "Removing latest.json from ${tag}"
              gh release delete-asset "$tag" latest.json --yes
            fi
          done

      # Older Mac clients (≤0.2.22) check for a non-existent `macos-universal`
      # platform key and silently skip updates. Alias it to the universal
      # darwin artifact so those installs can still climb to a fixed build.
      - name: Alias macos-universal in latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(
            gh api "repos/${{ github.repository }}/releases" --paginate \
              --jq '.[] | select(.draft == false and (.tag_name | startswith("desktop-v"))) | .tag_name'
          )
          latest="${tags[0]:-}"
          if [ -z "$latest" ]; then
            echo "No desktop release"
            exit 0
          fi
          tmp="$(mktemp)"
          if ! gh release download "$latest" -p latest.json -O "$tmp"; then
            echo "No latest.json on ${latest}"
            exit 0
          fi
          python3 - "$tmp" <<'PY'
          import json, sys
          path = sys.argv[1]
          with open(path) as f:
              data = json.load(f)
          platforms = data.setdefault("platforms", {})
          src = (
              platforms.get("darwin-aarch64")
              or platforms.get("darwin-aarch64-app")
              or platforms.get("darwin-x86_64")
              or platforms.get("darwin-x86_64-app")
          )
          if not src:
              print("No darwin platform to alias")
              sys.exit(0)
          if platforms.get("macos-universal") == src:
              print("macos-universal already aliased")
              sys.exit(0)
          platforms["macos-universal"] = src
          with open(path, "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          print("Aliased macos-universal ->", src.get("url"))
          PY
          gh release delete-asset "$latest" latest.json --yes || true
          gh release upload "$latest" "$tmp" --clobber
          echo "Uploaded patched latest.json to ${latest}"
