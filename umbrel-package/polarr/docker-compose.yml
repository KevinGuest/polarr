version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: polarr_web_1
      APP_PORT: 3000
      PROXY_AUTH_WHITELIST: "/api/*"

  web:
    image: ghcr.io/kevinguest/polarr-app:0.4.0@sha256:822bdd2ee7998cd2a3a53d4096552e2abcb98cb8884169d7c0ac99a1060b4e81
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      - POLARR_DATA_DIR=/data
      - POLARR_MUSIC_DIR=/music
      - POLARR_DOWNLOADS_DIR=/music/downloads
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - POLARR_APP_VERSION=0.4.0
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${UMBREL_ROOT}/data/storage/downloads/music:/music
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/v1/status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
