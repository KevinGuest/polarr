manifestVersion: 1
id: polarr
category: media
name: Polarr
version: "0.6.4"
tagline: Discover, request, and stream your homeserver music
description: >-
  Polarr is a self-hosted music hub for umbrelOS. Point it at Lidarr (the same
  way Seerr connects to Sonarr and Radarr), request missing albums, fill gaps
  with an optional Downtify-style fallback downloader, and stream the catalog
  from the browser.


  🛠️ SET-UP INSTRUCTIONS


  After install, open Polarr and complete the first-run wizard in your browser.


  - Create an admin account for the Polarr UI


  - Add your Lidarr URL and API key (Umbrel users can try
  http://lidarr_server_1:8686 or your device IP with port 8686)


  - Optionally enable fallback acquisition for titles Lidarr cannot fetch


  - Scan your music folder and start listening


  Polarr does not ship Lidarr itself; install Lidarr from the Umbrel App Store
  first if you want automated *arr-style acquisition.
releaseNotes: >-
  Track rows show a Polarr badge when the file is on disk; Liked and Library drop the Source column.
  Liked Songs show album covers and play the library file.
  Now playing cards dedupe the same track across users.
  Search ranks your downloads first, plays the file, and paints library results before catalog.
  Karaoke uses on-disk library, Lidarr, and download files; the vocal mixer only runs when a file is actually playing.
developer: Polarr
website: https://github.com/KevinGuest/polarr
dependencies:
  - lidarr
repo: https://github.com/KevinGuest/polarr
support: https://github.com/KevinGuest/polarr/issues
port: 3647
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
permissions:
  - STORAGE_DOWNLOADS
submitter: merks
submission: ""
