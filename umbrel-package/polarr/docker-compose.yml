version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: polarr_web_1
      APP_PORT: 3000
      PROXY_AUTH_WHITELIST: "/api/*"
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/kevinguest/polarr-app:0.6.6@sha256:80b90c83b0fdcd37cc5b4c9bf8815de6b4291e5d40198467e4b4e4c388f8cf47
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      - POLARR_DATA_DIR=/data
      - POLARR_MUSIC_DIR=/music
      # Lidarr downloads to /downloads/music — {Artist}/file, no extra nest
      - POLARR_DOWNLOADS_DIR=/music
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - POLARR_APP_VERSION=0.6.6
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${UMBREL_ROOT}/data/storage/downloads/music:/music
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/v1/status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
