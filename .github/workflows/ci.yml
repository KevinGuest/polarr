name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only token, no secrets used anywhere in this workflow.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: Server (typecheck + next build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 22 matches the Dockerfile (node:22-bookworm-slim), which is what ships.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # No install scripts needed: tsc and next build don't load native addons.
      # (better-sqlite3 has no install script; onnxruntime-node's only fetches
      # optional GPU providers.) Verified locally on 0ee9635.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # next typegen writes the route types (LayoutProps etc.) that tsc needs.
      - name: Typecheck
        run: |
          npx next typegen
          npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  desktop-frontend:
    name: Desktop frontend (tsc + vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 24 matches release.yml's desktop build.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json

      # Shared UI in /src resolves imports through the root node_modules.
      - name: Install shared UI dependencies
        run: npm ci --ignore-scripts

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts

      # tsc --noEmit && vite build: the step that failed in desktop-v0.2.19.
      - name: Build desktop frontend
        working-directory: apps/desktop
        run: npm run build

  # Ratchet: only files touched by the push or pull request. The existing tree
  # has a lint backlog, so a full-repo gate would fail every run. Once a file
  # is edited it has to be formatted and lint-clean.
  quality:
    name: Lint and format (changed files)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prettier and ESLint on the diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$BASE_SHA"
          elif [ -n "${BASE_SHA:-}" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            BASE="$BASE_SHA"
          else
            BASE="HEAD~1"
          fi
          git diff --name-only --diff-filter=ACMR "$BASE" HEAD > "$RUNNER_TEMP/changed.txt"
          echo "Checking:"
          cat "$RUNNER_TEMP/changed.txt"
          mapfile -t fmt < <(grep -E '\.(ts|tsx|js|mjs|cjs|css|json|md|yml|yaml)$' "$RUNNER_TEMP/changed.txt" | grep -v 'package-lock.json' || true)
          if [ "${#fmt[@]}" -gt 0 ]; then
            npx prettier --check "${fmt[@]}"
          else
            echo "No files for Prettier."
          fi
          mapfile -t lint < <(grep -E '\.(ts|tsx|js|mjs|cjs)$' "$RUNNER_TEMP/changed.txt" | grep -E '^(src|eslint\.config\.mjs)' || true)
          if [ "${#lint[@]}" -gt 0 ]; then
            npx eslint "${lint[@]}"
          else
            echo "No files for ESLint."
          fi
