[package]
name = "polarr-desktop"
version = "0.2.2"
description = "Polarr desktop shell"
authors = ["Polarr"]
edition = "2021"

[lib]
name = "polarr_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
discord-rich-presence = "1.1"
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
http = "1"
