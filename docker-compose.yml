services:
  polarr:
    build: .
    container_name: polarr
    ports:
      - "3647:3000"
    environment:
      - POLARR_DATA_DIR=/data
      - POLARR_MUSIC_DIR=/music
      - POLARR_DOWNLOADS_DIR=/music/downloads
      # Optional per-instance Discord app (Admin UI can set these instead)
      # - POLARR_DISCORD_CLIENT_ID=
      # - POLARR_DISCORD_CLIENT_SECRET=
      - HOSTNAME=0.0.0.0
      - PORT=3000
    volumes:
      # Bind mounts: entrypoint chowns these to node (uid 1000) when started as root.
      # If you still see SQLITE_CANTOPEN: sudo chown -R 1000:1000 ./data ./music
      - ./data:/data
      - ./music:/music
    restart: unless-stopped
